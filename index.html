<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>root@node:~#</title>

<style>
html,body{
  margin:0;
  background:black;
  overflow:hidden;
  color:#00ff88;
  font-family: Consolas, monospace;
}

/* MATRIX */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* TERMINAL */
#terminal{
  position:relative;
  z-index:2;
  width:min(900px,94vw);
  margin:30px auto;
  background:rgba(0,0,0,.93);
  border:1px solid #00ff8855;
  padding:18px;
  box-shadow:0 0 40px #00ff8840;
}
.line{white-space:pre;}
.red{color:#ff2e2e;}
.glitch{animation:glitch .15s infinite;}
@keyframes glitch{
  0%{text-shadow:2px 0 red;}
  50%{text-shadow:-2px 0 cyan;}
  100%{text-shadow:2px 0 red;}
}

/* FLASH */
.flash{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  opacity:0;
  background:#ff0000;
}
.flash.active{animation:flashbang .45s ease-out;}
@keyframes flashbang{
  0%{opacity:0;}
  10%{opacity:1;}
  40%{opacity:.95;}
  100%{opacity:0;}
}

/* FAKE SCREEN SHARE */
#share{
  position:fixed;
  inset:0;
  z-index:9000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  color:#ff2e2e;
  font-size:26px;
  letter-spacing:2px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
#share.show{opacity:1;}
  /* ===== MOBILE FIXES – FUNCTIONALITY UNCHANGED ===== */

/* ασφαλές ύψος viewport (iOS address bar bug) */
@supports (height: 100dvh){
  body{ min-height:100dvh; }
}

/* terminal να μη βγαίνει εκτός */
#terminal{
  max-height: 72vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* μικρότερη γραμματοσειρά μόνο σε μικρές οθόνες */
@media (max-width: 420px){
  #terminal{
    font-size: 13px;
    padding: 12px;
  }
}

/* αποφυγή overflow από μεγάλες γραμμές */
.line{
  white-space: pre-wrap;
  word-break: break-word;
}

/* matrix canvas να μη “τρώει” taps */
canvas{
  pointer-events: none;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div id="terminal"></div>

<div class="flash" id="flash1"></div>
<div class="flash" id="flash2"></div>

<div id="share">SCREEN SHARE INITIALIZED</div>

<script>
// ---------- MATRIX ----------
const c=document.getElementById("matrix");
const ctx=c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
resize(); onresize=resize;

const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";
const fs=14;
const cols=Math.floor(c.width/fs);
const drops=Array(cols).fill(1);

setInterval(()=>{
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#00ff88";
  ctx.font=fs+"px monospace";
  drops.forEach((y,i)=>{
    const t=chars[Math.random()*chars.length|0];
    ctx.fillText(t,i*fs,y*fs);
    if(y*fs>c.height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  });
},50);

// ---------- PRANK ----------
const nick=new URLSearchParams(location.search).get("nick")||"USER";
const term=document.getElementById("terminal");

const lines=[
  "root@node:~# init secure shell",
  "establishing encrypted tunnel...",
  "requesting screen stream...",
  "screen stream accepted",
  `active target: ${nick}`,
  "injecting live monitor...",
  "██████▒▒▒▒▒ 64%",
  "██████████ 100%",
  "LIVE SESSION ACTIVE"
];

// ---- AUDIO (οξύ) ----
let audioCtx=null;
addEventListener("click",()=>{
  if(!audioCtx) audioCtx=new (AudioContext||webkitAudioContext)();
},{once:true});

function beep(freq=1600, dur=70){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator();
  o.frequency.value=freq;
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),dur);
}

// 4 γρήγορα οξέα beep
function beepBurst(){
  let i=0;
  const id=setInterval(()=>{
    beep(1700,60);
    if(navigator.vibrate) navigator.vibrate(40);
    i++;
    if(i>=4) clearInterval(id);
  },120);
}

// συνεχόμενο alarm beep
let alarmOsc=null;
function startAlarm(){
  if(!audioCtx || alarmOsc) return;
  alarmOsc=audioCtx.createOscillator();
  alarmOsc.frequency.value=1500;
  alarmOsc.connect(audioCtx.destination);
  alarmOsc.start();
}
function stopAlarm(){
  if(alarmOsc){
    alarmOsc.stop();
    alarmOsc.disconnect();
    alarmOsc=null;
  }
}

// FLASH
function flash(el){
  el.classList.remove("active");
  void el.offsetWidth;
  el.classList.add("active");
}

// TYPE (πολύ γρήγορο)
async function type(t){
  const d=document.createElement("div");
  d.className="line";
  term.appendChild(d);
  for(let i=0;i<t.length;i++){
    d.textContent+=t[i];
    if(Math.random()>.7) beep(1400,40);
    await new Promise(r=>setTimeout(r,10));
  }
}
// ===== MOBILE PERFORMANCE GUARD (NO LOGIC CHANGE) =====
const isSmallScreen = Math.min(window.innerWidth, window.innerHeight) < 480;

// αν η συσκευή είναι μικρή, χαλαρώνουμε ΕΛΑΦΡΑ το redraw
if (isSmallScreen) {
  // μειώνει μόνο το matrix redraw, όχι το prank
  clearInterval?.(window.__matrixInterval);
}

// RUN
async function run(){
  const f1=flash1, f2=flash2, share=document.getElementById("share");
logVisit();
  // ΔΙΠΛΟ RED FLASH + 4 BEEPS + ΔΟΝΗΣΗ
  flash(f1); beepBurst();
  setTimeout(()=>flash(f2),120);

  // FAKE SCREEN SHARE
  setTimeout(()=>share.classList.add("show"),350);
  setTimeout(()=>share.classList.remove("show"),1200);

  if(navigator.vibrate) navigator.vibrate([120,60,120]);

  for(const l of lines){
    await type(l);
    await new Promise(r=>setTimeout(r,90));
  }
function logVisit(){
  const params = new URLSearchParams(location.search);

  const payload = {
    time: new Date().toLocaleString(),
    nick: params.get("nick") || "unknown",
    page: location.href,
    screen: `${screen.width}x${screen.height}`,
    language: navigator.language
  };

  fetch("https://script.google.com/macros/s/AKfycbwFsjokXGNyKiqsgL18DwCEF4nf_J8CLWSYFh1QZ-CphyCb5KcFWplyduDsI7rG1UNl/exec", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
}

  // ALERT
  startAlarm();
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);

  setTimeout(stopAlarm,2600);

  const end=document.createElement("div");
  end.className="line glitch red";
  end.textContent=`
⚠ SYSTEM ALERT ⚠

Αγαπητέ συγχωριανέ Nick Aftias
Την πάτησες 🤣🤣🤣

Με το που μπήκες εδώ :
✔ Με το αρχικό Flash πήραμε τη 
φωτογραφία σου
✔ Έχουμε πλέον καταγράψει την IP 
σου και το βρόγχο που συνδέθηκες
✔ Έχουμε πρόσβαση στην συσκευή και 
την οθόνη σου

Σε  ευχαριστούμε πολύ
Ραντεβού στην Ευελπίδων 🤣
`;
  term.appendChild(end);
}

run();
</script>

</body>
</html>
