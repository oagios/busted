<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>root@node:~#</title>

<style>
html,body{
  margin:0;
  background:black;
  overflow:hidden;
  color:#00ff88;
  font-family: Consolas, monospace;
}

/* MATRIX */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* TERMINAL */
#terminal{
  position:relative;
  z-index:2;
  width:min(900px,94vw);
  margin:30px auto;
  background:rgba(0,0,0,.93);
  border:1px solid #00ff8855;
  padding:18px;
  box-shadow:0 0 40px #00ff8840;
  max-height:72vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.line{
  white-space:pre-wrap;
  word-break:break-word;
}
.red{color:#ff2e2e;}
.glitch{animation:glitch .15s infinite;}
@keyframes glitch{
  0%{text-shadow:2px 0 red;}
  50%{text-shadow:-2px 0 cyan;}
  100%{text-shadow:2px 0 red;}
}

/* FLASH */
.flash{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  opacity:0;
  background:#ff0000;
}
.flash.active{animation:flashbang .45s ease-out;}
@keyframes flashbang{
  0%{opacity:0;}
  10%{opacity:1;}
  40%{opacity:.95;}
  100%{opacity:0;}
}

/* FAKE SCREEN SHARE */
#share{
  position:fixed;
  inset:0;
  z-index:9000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  color:#ff2e2e;
  font-size:26px;
  letter-spacing:2px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
#share.show{opacity:1;}

@media (max-width:420px){
  #terminal{font-size:13px;padding:12px;}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div id="terminal"></div>

<div class="flash" id="flash1"></div>
<div class="flash" id="flash2"></div>
<div id="share">SCREEN SHARE INITIALIZED</div>

<script>
// ================= MATRIX =================
const c = document.getElementById("matrix");
const ctx = c.getContext("2d");
function resize(){ c.width=innerWidth; c.height=innerHeight; }
resize(); addEventListener("resize", resize);

const chars="01ABCDEF#$%";
const fs=14;
let drops=Array(Math.floor(c.width/fs)).fill(1);

setInterval(()=>{
  ctx.fillStyle="rgba(0,0,0,0.12)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#00ff88";
  ctx.font=fs+"px monospace";
  drops.forEach((y,i)=>{
    ctx.fillText(chars[Math.random()*chars.length|0], i*fs, y*fs);
    if(y*fs>c.height && Math.random()>0.98) drops[i]=0;
    drops[i]++;
  });
},80);

// ================= LOG VISIT (GOOGLE SHEET) =================
function logVisit(){
  const params = new URLSearchParams(location.search);

  const payload = {
    time: new Date().toLocaleString(),
    nick: params.get("nick") || "unknown",
    page: location.href,
    screen: `${screen.width}x${screen.height}`,
    language: navigator.language
  };

  fetch("ΒΑΛΕ-ΕΔΩ-ΤΟ-WEB-APP-URL", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(()=>{});
}

// ================= PRANK =================
const nick = new URLSearchParams(location.search).get("nick") || "USER";
const term = document.getElementById("terminal");

const lines=[
  "root@node:~# init secure shell",
  "establishing encrypted tunnel...",
  "requesting screen stream...",
  "screen stream accepted",
  `active target: ${nick}`,
  "injecting live monitor...",
  "██████▒▒▒▒▒ 64%",
  "██████████ 100%",
  "LIVE SESSION ACTIVE"
];

// AUDIO
let audioCtx=null;
addEventListener("pointerdown",()=>{
  if(!audioCtx) audioCtx=new (AudioContext||webkitAudioContext)();
},{once:true});

function beep(freq=1600, dur=60){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator();
  o.frequency.value=freq;
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),dur);
}

function beepBurst(){
  let i=0;
  const id=setInterval(()=>{
    beep(1700,50);
    if(navigator.vibrate) navigator.vibrate(30);
    if(++i>=4) clearInterval(id);
  },110);
}

let alarmOsc=null;
function startAlarm(){
  if(!audioCtx || alarmOsc) return;
  alarmOsc=audioCtx.createOscillator();
  alarmOsc.frequency.value=1500;
  alarmOsc.connect(audioCtx.destination);
  alarmOsc.start();
}
function stopAlarm(){
  if(alarmOsc){ alarmOsc.stop(); alarmOsc=null; }
}

// EFFECTS
function flash(el){
  el.classList.remove("active");
  void el.offsetWidth;
  el.classList.add("active");
}

async function typeLine(text){
  const d=document.createElement("div");
  d.className="line";
  term.appendChild(d);
  for(let i=0;i<text.length;i++){
    d.textContent+=text[i];
    if(Math.random()>.75) beep(1400,35);
    await new Promise(r=>setTimeout(r,12));
  }
}

// ================= RUN =================
async function run(){
  const f1=document.getElementById("flash1");
  const f2=document.getElementById("flash2");
  const share=document.getElementById("share");

  logVisit(); // 👈 ΓΡΑΦΕΙ ΣΤΟ SHEET

  flash(f1); beepBurst();
  setTimeout(()=>flash(f2),120);

  setTimeout(()=>share.classList.add("show"),300);
  setTimeout(()=>share.classList.remove("show"),1000);

  for(const l of lines){
    await typeLine(l);
    await new Promise(r=>setTimeout(r,80));
  }

  await new Promise(r=>setTimeout(r,300));

  startAlarm();
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  setTimeout(stopAlarm,2200);

  const end=document.createElement("div");
  end.className="line glitch red";
  end.textContent=`
⚠ SYSTEM ALERT ⚠

Αγαπητέ συγχωριανέ Nick Aftias
Την πάτησες 🤣🤣🤣

Με το που μπήκες εδώ :
✔ Με το αρχικό Flash πήραμε τη 
φωτογραφία σου
✔ Έχουμε πλέον καταγράψει την IP 
σου και το βρόγχο που συνδέθηκες
✔ Έχουμε πρόσβαση στην συσκευή και 
την οθόνη σου

Σε  ευχαριστούμε πολύ
Ραντεβού στην Ευελπίδων 🤣
`;
  term.appendChild(end);
}

run();
</script>

</body>
</html>
